<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grok Manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0e'/%3E%3Cg transform='translate(4 4)' fill='%23ff4fa3'%3E%3Cpath d='M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0c0e;
        --panel: #16161a;
        --panel-2: #1c1c22;
        --line: #2c2c32;
        --fg: #f4f4f5;
        --muted: #9b9ba4;
        --accent: #ff4fa3;
        --accent-dim: rgba(255, 79, 163, 0.14);
        --danger: #ff6b8a;
        --ok: #b6f2c8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 8% -10%, rgba(255, 79, 163, 0.16), transparent 55%),
          var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        width: min(980px, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: 3.2rem 0 5rem;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1.5rem;
        margin-bottom: 1.75rem;
      }
      .brand { display: flex; align-items: center; gap: 0.55rem; }
      .logo {
        display: inline-flex;
        width: 1.45rem;
        height: 1.45rem;
        color: var(--accent);
        flex: none;
      }
      .logo svg { width: 100%; height: 100%; display: block; }
      .brand h1 {
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        font-weight: 560;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .brand .grok { color: var(--accent); }
      .mark {
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.2rem 0.5rem 0.15rem;
      }
      .mark span {
        display: inline-block;
        transform: translate(1px, -1px);
      }
      .version {
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-decoration: none;
        transition: color 220ms ease;
      }
      a.version:hover,
      a.version:focus-visible {
        color: #fff;
      }
      .lede {
        margin: 0.45rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .lede .machine { color: var(--accent); }
      .machine-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 0.15rem 0.75rem;
        margin: 0.45rem 0 0;
      }
      #extra-machines { display: contents; }
      .extra-machine {
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
      }
      .extra-machine a { color: var(--accent); text-decoration: none; }
      .extra-machine a:hover, .extra-machine a:focus-visible { text-decoration: underline; }
      button.machine-remove {
        border: 0;
        background: none;
        padding: 0 0.1rem;
        color: rgba(255, 255, 255, 0.5);
        font: inherit;
        font-size: 0.95rem;
        line-height: 1;
        cursor: pointer;
      }
      button.machine-remove:hover, button.machine-remove:focus-visible { color: #fff; }
      button.add-machines {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 20px;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        line-height: 0;
        cursor: pointer;
        transform: translateY(1px);
      }
      button.add-machines svg { display: block; width: 45px; height: 20px; }
      button.add-machines:hover g, button.add-machines:focus-visible g { opacity: 1; }
      .update-line {
        margin: 0.55rem 0 0;
        font-size: 0.85rem;
        color: var(--accent);
      }
      button.update-now {
        margin-left: 0.55rem;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
      }
      .tools { display: flex; flex-direction: column; align-items: flex-end; gap: 0.55rem; }
      button.fold-all {
        font: inherit;
        font-size: 0.82rem;
        border-radius: 999px;
        padding: 0.38rem 0.75rem;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      button.fold-all:hover, button.fold-all:focus-visible { border-color: var(--accent); color: var(--accent); }
      button.fold-all:disabled { opacity: 0.45; cursor: not-allowed; }
      button.fold-all { align-self: flex-end; }
      .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
      input[type="search"] {
        width: min(280px, 70vw);
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.62rem 0.95rem;
        font: inherit;
        font-size: 0.92rem;
        outline: none;
      }
      input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
      .error {
        background: rgba(255, 107, 138, 0.1);
        color: var(--danger);
        border: 1px solid rgba(255, 107, 138, 0.35);
        border-radius: 12px;
        padding: 0.75rem 0.9rem;
        margin: 0 0 1rem;
      }
      .empty { color: var(--muted); padding: 2rem 0; }
      section { margin: 0 0 1.35rem; }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0 0.15rem 0.45rem;
      }
      .section-head h2 {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        margin: 0;
        font-size: 1.02rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      button.fold {
        display: inline-flex;
        align-items: center;
        gap: 0.28rem;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button.fold svg {
        width: 1rem;
        height: 1rem;
        color: var(--muted);
        flex: none;
      }
      button.fold:hover svg, button.fold:focus-visible svg { color: var(--fg); }
      button.fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
      ul.rows[hidden] { display: none; }
      button.path {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.75rem;
        text-align: left;
        cursor: pointer;
      }
      button.path:hover, button.path:focus-visible { color: var(--fg); }
      .n {
        color: var(--muted);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }
      ul.rows {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      li.row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto auto auto auto;
        gap: 0.8rem 1rem;
        align-items: center;
        padding: 0.85rem 1rem;
        border-top: 1px solid var(--line);
      }
      .check {
        width: 1.05rem;
        height: 1.05rem;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .check:disabled { cursor: not-allowed; }
      .head-main { display: flex; align-items: flex-start; gap: 0.7rem; min-width: 0; }
      .head-actions { display: flex; align-items: center; gap: 0.55rem; }
      button.lock, button.pin {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      button.lock svg, button.pin svg { width: 1rem; height: 1rem; }
      button.lock[aria-pressed="true"], button.pin[aria-pressed="true"] {
        color: var(--accent);
        border-color: rgba(255, 79, 163, 0.7);
      }
      button.lock:disabled, button.pin:disabled { opacity: 0.45; cursor: wait; }
      button.drag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.15rem;
        height: 2rem;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: grab;
        touch-action: none;
      }
      button.drag svg { width: 1rem; height: 1rem; }
      button.drag:hover, button.drag:focus-visible { color: var(--fg); }
      button.drag:active, li.row.dragging button.drag { cursor: grabbing; }
      section.pinned { margin-bottom: 1.7rem; }
      section.pinned ul.rows {
        position: relative;
        isolation: isolate;
        border-color: rgba(255, 79, 163, 0.55);
        background: var(--panel);
      }
      section.pinned ul.rows::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, rgba(255, 79, 163, 0.09), transparent 42%);
        pointer-events: none;
        z-index: 2;
      }
      section.pinned li.row { background: var(--panel); }
      section.pinned ul.rows.reordering li.row {
        transition: transform 160ms cubic-bezier(0.2, 0, 0, 1), box-shadow 160ms ease;
      }
      section.pinned li.drag-slot {
        visibility: hidden;
        border: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
      }
      li.row.dragging {
        position: fixed;
        z-index: 30;
        margin: 0;
        border: 0;
        border-radius: 14px;
        background: #1e1e24;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
        pointer-events: none;
        transition: none;
      }
      @media (prefers-reduced-motion: reduce) {
        section.pinned ul.rows.reordering li.row { transition: none; }
        .version { transition: none; }
      }
      .where {
        display: inline-flex;
        align-items: center;
        margin-left: 0.45rem;
        padding: 0.08rem 0.45rem;
        border: 1px solid rgba(255, 79, 163, 0.45);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        vertical-align: 0.12em;
      }
      .separator {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.3rem 0 1.35rem;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .separator::before, .separator::after {
        content: "";
        height: 1px;
        flex: 1;
      }
      .separator::before { background: linear-gradient(90deg, var(--accent), transparent); }
      .separator::after { background: linear-gradient(90deg, transparent, var(--accent)); }
      .pill {
        display: inline-flex;
        align-items: center;
        margin-left: 0.4rem;
        color: var(--accent);
        vertical-align: -0.15em;
      }
      .pill svg { width: 0.95rem; height: 0.95rem; }
      .selection {
        position: fixed;
        left: 50%;
        bottom: 1.25rem;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.7rem;
        width: min(520px, calc(100% - 1.5rem));
        padding: 0.7rem 0.8rem 0.7rem 1rem;
        background: #121216;
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
      }
      .selection[hidden] { display: none; }
      .selection .picked {
        flex: 1;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .dialog ul.names {
        list-style: none;
        margin: 0.8rem 0 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
        border-top: 1px solid var(--line);
      }
      .dialog ul.names li {
        padding: 0.45rem 0;
        border-bottom: 1px solid var(--line);
        font-size: 0.92rem;
      }
      .dialog ul.names .sid {
        display: block;
        margin-top: 0.15rem;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.72rem;
      }
      li.row:first-child { border-top: 0; }
      li.row:hover { background: var(--panel-2); }
      .title {
        font-size: 0.98rem;
        letter-spacing: -0.01em;
        min-width: 0;
      }
      .meta {
        display: flex;
        gap: 0.7rem;
        align-items: center;
        margin-top: 0.22rem;
        min-width: 0;
      }
      button.id {
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.75rem;
        color: var(--muted);
        background: transparent;
        border: 0;
        padding: 0;
        text-align: left;
        cursor: pointer;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.id:hover, button.id:focus-visible { color: var(--fg); }
      .model { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
      .when, .live {
        font-size: 0.82rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .live { color: var(--accent); }
      button.danger, button.ghost {
        font: inherit;
        font-size: 0.82rem;
        border-radius: 999px;
        padding: 0.38rem 0.75rem;
        cursor: pointer;
      }
      button.danger {
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
      }
      button.danger:hover { border-color: var(--danger); color: var(--danger); }
      button.move {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        cursor: pointer;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      button.move svg { width: 1rem; height: 1rem; }
      button.danger:disabled, button.ghost:disabled, button.move:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .move-field {
        display: block;
        margin-top: 0.85rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .move-field select, .move-field input {
        display: block;
        width: 100%;
        margin-top: 0.35rem;
        background: #0c0c0e;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.55rem 0.7rem;
        font: inherit;
        font-size: 0.92rem;
      }
      .dialog .field-error { color: var(--danger); font-size: 0.85rem; }
      .dialog-back {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.2rem;
      }
      .dialog-back[hidden] { display: none; }
      .dialog {
        width: min(460px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1.25rem 1.25rem 1.1rem;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .dialog h3 { margin: 0 0 0.4rem; font-size: 1.15rem; letter-spacing: -0.02em; }
      .dialog p { margin: 0.35rem 0; color: var(--muted); line-height: 1.45; }
      .dialog .who { color: var(--fg); }
      .dialog code {
        display: block;
        margin-top: 0.7rem;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.78rem;
        color: var(--accent);
        word-break: break-all;
      }
      .actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.1rem; }
      button.ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      button.confirm {
        font: inherit;
        font-size: 0.85rem;
        color: #1a0a12;
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 0.48rem 0.9rem;
        cursor: pointer;
      }
      button.confirm:disabled { opacity: 0.6; cursor: wait; }
      @media (max-width: 720px) {
        header { flex-direction: column; align-items: stretch; }
        .tools { align-items: stretch; }
        button.fold-all { align-self: flex-start; }
        input[type="search"] { width: 100%; }
        li.row { grid-template-columns: auto minmax(0, 1fr) auto auto auto auto; }
        .when, .live { grid-column: 2; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <div class="brand">
            <span class="logo" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9.27 15.29l7.978-5.897c.391-.29.95-.177 1.137.272.98 2.369.542 5.215-1.41 7.169-1.951 1.954-4.667 2.382-7.149 1.406l-2.711 1.257c3.889 2.661 8.611 2.003 11.562-.953 2.341-2.344 3.066-5.539 2.388-8.42l.006.007c-.983-4.232.242-5.924 2.75-9.383.06-.082.12-.164.179-.248l-3.301 3.305v-.01L9.267 15.292M7.623 16.723c-2.792-2.67-2.31-6.801.071-9.184 1.761-1.763 4.647-2.483 7.166-1.425l2.705-1.25a7.808 7.808 0 00-1.829-1A8.975 8.975 0 005.984 5.83c-2.533 2.536-3.33 6.436-1.962 9.764 1.022 2.487-.653 4.246-2.34 6.022-.599.63-1.199 1.259-1.682 1.925l7.62-6.815"/></svg></span>
            <h1><span class="grok">Grok</span> Manager</h1>
            <span class="mark"><span>Build</span></span>
            <a class="version" href="https://github.com/pixelwave/grok-manager">__VERSION__</a>
          </div>
          <p class="lede">Sessions on this machine: <span class="machine">__HOSTNAME__</span></p>
          <div class="machine-row">
            <button class="add-machines" id="add-machines" type="button" aria-label="Add machine"><svg width="45" height="20" viewBox="0 0 45 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g opacity="0.3"><path d="M35 18.5V20H10V18.5H35ZM43.5 10C43.5 5.30558 39.6944 1.5 35 1.5H10C5.30558 1.5 1.5 5.30558 1.5 10C1.5 14.6944 5.30558 18.5 10 18.5V20L9.48535 19.9873C4.20167 19.7195 0 15.3502 0 10C0 4.47715 4.47715 4.02661e-08 10 0H35C40.5228 0 45 4.47715 45 10C45 15.3502 40.7983 19.7195 35.5146 19.9873L35 20V18.5C39.6944 18.5 43.5 14.6944 43.5 10Z" fill="white"/><path d="M31.1971 14H28.2397V5.27271H31.2568C32.1233 5.27271 32.8676 5.44742 33.4897 5.79685C34.1147 6.14344 34.5949 6.64202 34.9301 7.29259C35.2653 7.94316 35.4329 8.72157 35.4329 9.62782C35.4329 10.5369 35.2639 11.3182 34.9258 11.9716C34.5906 12.625 34.1062 13.1264 33.4727 13.4758C32.842 13.8253 32.0835 14 31.1971 14ZM29.8207 12.6321H31.1204C31.7284 12.6321 32.2355 12.5213 32.6417 12.2997C33.048 12.0753 33.3534 11.7415 33.5579 11.2983C33.7625 10.8523 33.8647 10.2954 33.8647 9.62782C33.8647 8.96021 33.7625 8.40623 33.5579 7.96589C33.3534 7.52271 33.0508 7.19174 32.6503 6.97299C32.2525 6.7514 31.7582 6.6406 31.1673 6.6406H29.8207V12.6321Z" fill="white"/><path d="M22.5018 14H19.5444V5.27271H22.5615C23.428 5.27271 24.1723 5.44742 24.7944 5.79685C25.4194 6.14344 25.8995 6.64202 26.2348 7.29259C26.57 7.94316 26.7376 8.72157 26.7376 9.62782C26.7376 10.5369 26.5686 11.3182 26.2305 11.9716C25.8953 12.625 25.4109 13.1264 24.7774 13.4758C24.1467 13.8253 23.3882 14 22.5018 14ZM21.1254 12.6321H22.4251C23.0331 12.6321 23.5402 12.5213 23.9464 12.2997C24.3527 12.0753 24.6581 11.7415 24.8626 11.2983C25.0672 10.8523 25.1694 10.2954 25.1694 9.62782C25.1694 8.96021 25.0672 8.40623 24.8626 7.96589C24.6581 7.52271 24.3555 7.19174 23.9549 6.97299C23.5572 6.7514 23.0629 6.6406 22.472 6.6406H21.1254V12.6321Z" fill="white"/><path d="M11.9814 14H10.2939L13.3664 5.27271H15.3181L18.3948 14H16.7073L14.3763 7.06248H14.3082L11.9814 14ZM12.0368 10.5781H16.6391V11.848H12.0368V10.5781Z" fill="white"/></g></svg></button>

          <button class="fold-all" id="fold-all" type="button">Collapse all</button>

    </div>
    <div class="selection" id="selection" hidden>
      <span class="picked" id="selection-count"></span>
      <button class="ghost" id="clear-selection" type="button">Clear</button>
      <button class="danger" id="delete-selected" type="button">Delete selected</button>
    </div>

    <div class="dialog-back" id="dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h3 id="dialog-title">Delete this session?</h3>
        <p id="dialog-copy">This removes <span class="who" id="dialog-name"></span> from disk. It cannot be resumed.</p>
        <code id="dialog-id"></code>
        <ul class="names" id="dialog-list" hidden></ul>
        <p id="dialog-move" hidden>Choose a project folder. The conversation stays with the session.</p>
        <label class="move-field" id="move-field" hidden>
          Folder
          <select id="move-target"></select>
        </label>
        <div class="actions">
          <button class="ghost" id="cancel" type="button">Cancel</button>
          <button class="confirm" id="confirm" type="button">Delete</button>

    </div>

    <div class="dialog-back" id="machine-dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="machine-title">
        <h3 id="machine-title">Add a machine</h3>
        <p>The name links to that manager.</p>
        <label class="move-field">Machine name
          <input id="machine-name" type="text" maxlength="80" autocomplete="off" />
        </label>
        <label class="move-field">URL
          <input id="machine-url" type="url" maxlength="500" placeholder="https://example:8090/" autocomplete="off" />
        </label>
        <p class="field-error" id="machine-error" hidden></p>
        <div class="actions">
          <button class="ghost" id="machine-cancel" type="button">Cancel</button>
          <button class="confirm" id="machine-add" type="button">Add</button>
        </div>
      </div>
    </div>

    <script>
      const listEl = document.getElementById("list");
      const filterEl = document.getElementById("filter");
      const countEl = document.getElementById("count");
      const errorEl = document.getElementById("error");
      const dialogEl = document.getElementById("dialog");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogCopy = document.getElementById("dialog-copy");
      const dialogName = document.getElementById("dialog-name");
      const dialogId = document.getElementById("dialog-id");
      const dialogList = document.getElementById("dialog-list");
      const dialogMove = document.getElementById("dialog-move");
      const moveField = document.getElementById("move-field");
      const moveTarget = document.getElementById("move-target");
      const cancelBtn = document.getElementById("cancel");
      const confirmBtn = document.getElementById("confirm");
      const selectionEl = document.getElementById("selection");
      const selectionCount = document.getElementById("selection-count");
      const clearSelectionBtn = document.getElementById("clear-selection");
      const deleteSelectedBtn = document.getElementById("delete-selected");
      const foldAllBtn = document.getElementById("fold-all");
      const extraMachinesEl = document.getElementById("extra-machines");
      const addMachinesBtn = document.getElementById("add-machines");
      const machineDialog = document.getElementById("machine-dialog");
      const machineNameInput = document.getElementById("machine-name");
      const machineUrlInput = document.getElementById("machine-url");
      const machineError = document.getElementById("machine-error");
      const machineCancel = document.getElementById("machine-cancel");
      const machineAdd = document.getElementById("machine-add");

      let groups = [];
      let pinOrder = [];
      let machines = [];
      let discovered = [];
      let pending = [];
      let dialogMode = "delete";
      const selected = new Set();
      const collapsed = new Set();

      const FOLDER_INPUT_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"/><path d="M2 13h10"/><path d="m9 16 3-3-3-3"/></svg>';
      const LOCK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      const LOCK_OPEN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>';
      const PIN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
      const GRIP_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>';
      const CHEVRON_DOWN_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
      const CHEVRON_RIGHT_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

      function lockIcon(open) {
        const holder = document.createElement("span");
        holder.innerHTML = open ? LOCK_OPEN_SVG : LOCK_SVG;
        return holder.firstElementChild;
      }

      function folderInputIcon() {
        const holder = document.createElement("span");
        holder.innerHTML = FOLDER_INPUT_SVG;
        return holder.firstElementChild;
      }

      function pinIcon() {
        const holder = document.createElement("span");
        holder.innerHTML = PIN_SVG;
        return holder.firstElementChild;
      }

      function gripIcon() {
        const holder = document.createElement("span");
        holder.innerHTML = GRIP_SVG;
        return holder.firstElementChild;
      }

      function mergePinOrder(visible) {
        const visibleSet = new Set(visible);
        const full = pinOrder.slice();
        for (const id of visible) {
          if (!full.includes(id)) full.push(id);
        }
        let index = 0;
        return full.map((id) => (visibleSet.has(id) ? visible[index++] : id));
      }

      async function commitPinOrder(list) {
        const visible = [...list.querySelectorAll("li.row")].map((row) => row.dataset.id);
        const order = mergePinOrder(visible);
        if (order.join("\n") === pinOrder.join("\n")) return;
        showError("");
        let response;
        try {
          response = await fetch("/api/pins", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ order: order }),
          });
        } catch {
          showError("Could not reach Grok Manager.");
          await load();
          return;
        }
        if (!response.ok) {
          let message = "Could not reorder pins.";
          try {
            const body = await response.json();
            if (body && body.error) message = body.error;
          } catch { /* keep default */ }
          showError(message);
          await load();
          return;
        }
        pinOrder = order;
      }

      function rowOrder(list) {
        return [...list.querySelectorAll("li.row")].map((row) => row.dataset.id).join("\n");
      }

      function slideRows(list) {
        const rows = [...list.querySelectorAll("li.row")].filter((row) => !row.classList.contains("dragging"));
        const before = new Map(rows.map((row) => [row, row.offsetTop]));
        return () => {
          let changed = false;
          for (const [row, top] of before) {
            const delta = top - row.offsetTop;
            if (!delta) continue;
            changed = true;
            row.style.transition = "none";
            row.style.transform = "translateY(" + delta + "px)";
          }
          if (!changed) return;
          list.getBoundingClientRect();
          for (const row of before.keys()) {
            row.style.transition = "";
            row.style.transform = "";
          }
        };
      }

      function settleDrag(list) {
        window.setTimeout(() => {
          if (!list.querySelector("li.row.dragging")) list.classList.remove("reordering");
        }, 180);
      }

      function bindPinnedDrag(handle, li) {
        handle.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          const list = li.parentElement;
          const startOrder = rowOrder(list);
          const bounds = li.getBoundingClientRect();
          const grabOffset = event.clientY - bounds.top;
          const placeholder = document.createElement("li");
          placeholder.className = "row drag-slot";
          placeholder.dataset.id = li.dataset.id;
          placeholder.style.height = bounds.height + "px";
          list.classList.add("reordering");
          list.insertBefore(placeholder, li);
          li.classList.add("dragging");
          li.style.left = bounds.left + "px";
          li.style.top = bounds.top + "px";
          li.style.width = bounds.width + "px";
          li.style.transform = "scale(1.012)";
          document.body.append(li);
          const follow = (clientY) => {
            li.style.top = (clientY - grabOffset) + "px";
          };
          const move = (ev) => {
            if (ev.pointerId !== event.pointerId) return;
            const pointer = ev.clientY - list.getBoundingClientRect().top;
            const target = [...list.querySelectorAll("li.row")].find((row) => {
              if (row === placeholder) return false;
              return pointer < row.offsetTop + row.offsetHeight / 2;
            });
            const before = rowOrder(list);
            const play = slideRows(list);
            if (target) list.insertBefore(placeholder, target);
            else list.append(placeholder);
            if (rowOrder(list) !== before) play();
            follow(ev.clientY);
          };
          const finish = (ev) => {
            if (ev.pointerId !== event.pointerId) return;
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", finish);
            window.removeEventListener("pointercancel", finish);
            const dest = placeholder.getBoundingClientRect();
            const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const land = () => {
              li.classList.remove("dragging");
              li.removeAttribute("style");
              placeholder.replaceWith(li);
              settleDrag(list);
              if (rowOrder(list) !== startOrder) commitPinOrder(list);
            };
            if (reduced) {
              land();
              return;
            }
            li.style.transition = "top 160ms cubic-bezier(0.2, 0, 0, 1), left 160ms cubic-bezier(0.2, 0, 0, 1), transform 160ms cubic-bezier(0.2, 0, 0, 1)";
            li.style.left = dest.left + "px";
            li.style.top = dest.top + "px";
            li.style.transform = "none";
            window.setTimeout(land, 170);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", finish);
          window.addEventListener("pointercancel", finish);
        });
        handle.addEventListener("keydown", (event) => {
          const list = li.parentElement;
          const up = event.key === "ArrowUp" && li.previousElementSibling;
          const down = event.key === "ArrowDown" && li.nextElementSibling;
          if (!up && !down) return;
          event.preventDefault();
          list.classList.add("reordering");
          const play = slideRows(list);
          if (up) list.insertBefore(li, li.previousElementSibling);
          else list.insertBefore(li.nextElementSibling, li);
          play();
          settleDrag(list);
          commitPinOrder(list);
          handle.focus();
        });
      }

      function chevronIcon(folded) {
        const holder = document.createElement("span");
        holder.innerHTML = folded ? CHEVRON_RIGHT_SVG : CHEVRON_DOWN_SVG;
        return holder.firstElementChild;
      }

      function shownGroups(query) {
        return groups.filter((group) => group.sessions.some((session) => matches(session, query)));
      }

      function everyShownCollapsed(query) {
        const shown = shownGroups(query);
        return shown.length > 0 && shown.every((group) => collapsed.has(group.cwd));
      }

      function syncFoldAll() {
        const query = filterEl.value.trim().toLowerCase();
        const allFolded = everyShownCollapsed(query);
        foldAllBtn.textContent = allFolded ? "Expand all" : "Collapse all";
        foldAllBtn.setAttribute("aria-pressed", allFolded ? "true" : "false");
        foldAllBtn.disabled = shownGroups(query).length === 0;
      }

      foldAllBtn.addEventListener("click", () => {
        const query = filterEl.value.trim().toLowerCase();
        const shown = shownGroups(query);
        if (everyShownCollapsed(query)) {
          for (const group of shown) collapsed.delete(group.cwd);
        } else {
          for (const group of shown) collapsed.add(group.cwd);
        }
        render();
      });

      function showError(message) {
        if (!message) {
          errorEl.hidden = true;
          errorEl.textContent = "";
          return;
        }
        errorEl.hidden = false;
        errorEl.textContent = message;
      }

      function relTime(iso) {
        const then = Date.parse(iso);
        if (!Number.isFinite(then)) return "";
        const seconds = Math.round((Date.now() - then) / 1000);
        const steps = [
          [60, "just now", 1],
          [3600, "m", 60],
          [86400, "h", 3600],
          [86400 * 30, "d", 86400],
          [86400 * 365, "mo", 86400 * 30],
          [Infinity, "y", 86400 * 365],
        ];
        if (seconds < 60) return "just now";
        for (const [limit, unit, size] of steps) {
          if (Math.abs(seconds) < limit) {
            const n = Math.round(seconds / size);
            return n + unit + " ago";
          }
        }
        return "";
      }

      function matches(session, query) {
        if (!query) return true;
        const hay = (session.title + " " + session.id).toLowerCase();
        return hay.includes(query);
      }

      function render() {
        for (const group of groups) {
          for (const session of group.sessions) {
            if (!deletable(session)) selected.delete(session.id);
          }
        }
        const query = filterEl.value.trim().toLowerCase();
        listEl.replaceChildren();
        let shown = 0;
        let total = 0;
        const pinnedLookup = new Map();
        for (const group of groups) {
          for (const session of group.sessions) {
            if (session.pinned) pinnedLookup.set(session.id, { session, group });
          }
        }
        const copies = [];
        const seenPins = new Set();
        for (const id of pinOrder) {
          const item = pinnedLookup.get(id);
          if (!item || seenPins.has(id) || !matches(item.session, query)) continue;
          seenPins.add(id);
          copies.push(item);
        }
        for (const [id, item] of pinnedLookup) {
          if (seenPins.has(id) || !matches(item.session, query)) continue;
          copies.push(item);
        }
        if (copies.length) {
          const pinnedSection = document.createElement("section");
          pinnedSection.className = "pinned";
          const pinnedHead = document.createElement("div");
          pinnedHead.className = "section-head";
          const pinnedTitle = document.createElement("h2");
          pinnedTitle.textContent = "Pinned";
          const pinnedCount = document.createElement("div");
          pinnedCount.className = "n";
          pinnedCount.textContent = String(copies.length);
          pinnedHead.append(pinnedTitle, pinnedCount);
          const pinnedList = document.createElement("ul");
          pinnedList.className = "rows";
          for (const item of copies) pinnedList.append(row(item.session, item.group, true));
          pinnedSection.append(pinnedHead, pinnedList);
          const rule = document.createElement("div");
          rule.className = "separator";
          rule.setAttribute("role", "separator");
          rule.textContent = "All sessions";
          listEl.append(pinnedSection, rule);
        }
        for (const group of groups) {
          total += group.sessions.length;
          const sessions = group.sessions.filter((session) => matches(session, query));
          if (sessions.length === 0) continue;
          shown += sessions.length;
          const section = document.createElement("section");
          section.dataset.cwd = group.cwd;
          const head = document.createElement("div");
          head.className = "section-head";
          const titleWrap = document.createElement("div");
          titleWrap.className = "head-main";
          const selectable = sessions.filter((session) => deletable(session));
          const headCheck = document.createElement("input");
          headCheck.type = "checkbox";
          headCheck.className = "check";
          headCheck.disabled = selectable.length === 0;
          headCheck.title = "Select sessions in this folder";
          const picked = selectable.filter((session) => selected.has(session.id)).length;
          headCheck.checked = selectable.length > 0 && picked === selectable.length;
          headCheck.indeterminate = picked > 0 && picked < selectable.length;
          headCheck.addEventListener("change", () => {
            for (const session of selectable) {
              if (headCheck.checked) selected.add(session.id);
              else selected.delete(session.id);
            }
            syncChecks();
            updateBar();
          });
          const titles = document.createElement("div");
          const h2 = document.createElement("h2");
          const folded = collapsed.has(group.cwd);
          const fold = document.createElement("button");
          fold.type = "button";
          fold.className = "fold";
          fold.append(chevronIcon(folded), document.createTextNode(group.label));
          fold.setAttribute("aria-expanded", folded ? "false" : "true");
          fold.setAttribute("aria-label", (folded ? "Expand " : "Collapse ") + group.label);
          fold.addEventListener("click", () => {
            const now = !collapsed.has(group.cwd);
            if (now) collapsed.add(group.cwd);
            else collapsed.delete(group.cwd);
            ul.hidden = now;
            fold.setAttribute("aria-expanded", now ? "false" : "true");
            fold.setAttribute("aria-label", (now ? "Expand " : "Collapse ") + group.label);
            fold.replaceChildren(chevronIcon(now), document.createTextNode(group.label));
            syncFoldAll();
          });
          h2.append(fold);
          if (group.locked) {
            const pill = document.createElement("span");
            pill.className = "pill";
            pill.title = "Folder locked";
            pill.append(lockIcon(false));
            h2.append(pill);
          }
          const path = document.createElement("button");
          path.type = "button";
          path.className = "path";
          path.textContent = group.cwd;
          path.title = "Copy cd command";
          path.addEventListener("click", () => copyText("cd " + group.cwd, path));
          titles.append(h2, path);
          titleWrap.append(headCheck, titles);
          const actions = document.createElement("div");
          actions.className = "head-actions";
          const folderLock = document.createElement("button");
          folderLock.type = "button";
          folderLock.className = "lock";
          folderLock.append(lockIcon(!group.locked));
          folderLock.setAttribute("aria-pressed", group.locked ? "true" : "false");
          folderLock.setAttribute("aria-label", group.locked ? "Unlock this folder" : "Lock this folder");
          folderLock.title = group.locked ? "Unlock this folder" : "Lock this folder";
          folderLock.addEventListener("click", () => setLock("folder", group.cwd, !group.locked, folderLock));
          const n = document.createElement("div");
          n.className = "n";
          n.textContent = String(sessions.length);
          actions.append(folderLock, n);
          head.append(titleWrap, actions);
          const ul = document.createElement("ul");
          ul.className = "rows";
          ul.hidden = collapsed.has(group.cwd);
          for (const session of sessions) ul.append(row(session, group, false));
          section.append(head, ul);
          listEl.append(section);
        }
        countEl.textContent = total === 1 ? "1 session" : total + " sessions";
        syncFoldAll();
        if (shown === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = total === 0 ? "No sessions on this machine." : "No sessions match that filter.";
          listEl.append(empty);
        }
        updateBar();
      }

      function updateBar() {
        const count = selected.size;
        selectionEl.hidden = count === 0;
        selectionCount.textContent = count === 1 ? "1 selected" : count + " selected";
      }

      function syncChecks() {
        for (const box of listEl.querySelectorAll("li.row input.check")) {
          const id = box.closest("li").dataset.id;
          if (!box.disabled) box.checked = selected.has(id);
        }
        for (const section of listEl.querySelectorAll("section[data-cwd]")) {
          const boxes = [...section.querySelectorAll("li.row input.check")].filter((item) => !item.disabled);
          const head = section.querySelector(".head-main input.check");
          if (!head) continue;
          const picked = boxes.filter((item) => item.checked).length;
          head.checked = boxes.length > 0 && picked === boxes.length;
          head.indeterminate = picked > 0 && picked < boxes.length;
        }
      }

      function deletable(session) {
        if (!session || session.live || session.locked) return false;
        const group = groups.find((item) => item.sessions.some((row) => row.id === session.id));
        return !(group && group.locked);
      }

      function row(session, group, pinnedCopy) {
        const protectedSession = !!(session.locked || (group && group.locked));
        const li = document.createElement("li");
        li.className = "row";
        li.dataset.id = session.id;
        let lead;
        if (pinnedCopy) {
          lead = document.createElement("button");
          lead.type = "button";
          lead.className = "drag";
          lead.append(gripIcon());
          lead.setAttribute("aria-label", "Drag to reorder " + session.title);
          lead.title = "Drag to reorder";
          bindPinnedDrag(lead, li);
        } else {
          lead = document.createElement("input");
          lead.type = "checkbox";
          lead.className = "check";
          lead.checked = selected.has(session.id);
          lead.disabled = !!session.live || protectedSession;
          lead.title = session.live ? "Session Active" : protectedSession ? "Locked" : "Select session";
          if (!lead.disabled) {
            lead.addEventListener("change", () => {
              if (lead.checked) selected.add(session.id);
              else selected.delete(session.id);
              syncChecks();
              updateBar();
            });
          }
        }
        const main = document.createElement("div");
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = session.title;
        if (pinnedCopy) {
          const where = document.createElement("span");
          where.className = "where";
          where.textContent = group.label;
          title.append(where);
        }
        if (protectedSession) {
          const pill = document.createElement("span");
          pill.className = "pill";
          pill.title = "Locked";
          pill.append(lockIcon(false));
          title.append(pill);
        }
        const meta = document.createElement("div");
        meta.className = "meta";
        const idBtn = document.createElement("button");
        idBtn.type = "button";
        idBtn.className = "id";
        idBtn.textContent = session.id;
        idBtn.title = "Copy grok --resume command";
        idBtn.addEventListener("click", () => copyText("grok --resume " + session.id, idBtn));
        meta.append(idBtn);
        if (session.model) {
          const model = document.createElement("span");
          model.className = "model";
          model.textContent = session.model;
          meta.append(model);
        }
        main.append(title, meta);
        const when = document.createElement("div");
        if (session.live) {
          when.className = "live";
          when.textContent = "Session Active";
        } else {
          when.className = "when";
          when.textContent = relTime(session.updatedAt);
          if (session.updatedAt) when.title = session.updatedAt;
        }
        const pinBtn = document.createElement("button");
        pinBtn.type = "button";
        pinBtn.className = "pin";
        pinBtn.append(pinIcon());
        pinBtn.setAttribute("aria-pressed", session.pinned ? "true" : "false");
        pinBtn.setAttribute("aria-label", session.pinned ? "Unpin " + session.title : "Pin " + session.title);
        pinBtn.title = session.pinned ? "Unpin" : "Pin";
        pinBtn.addEventListener("click", () => setPin(session.id, !session.pinned, pinBtn));
        const lockBtn = document.createElement("button");
        lockBtn.type = "button";
        lockBtn.className = "lock";
        lockBtn.append(lockIcon(!session.locked));
        lockBtn.setAttribute("aria-pressed", session.locked ? "true" : "false");
        lockBtn.setAttribute("aria-label", session.locked ? "Unlock this session" : "Lock this session");
        lockBtn.title = session.locked ? "Unlock this session" : "Lock this session";
        lockBtn.addEventListener("click", () => setLock("session", session.id, !session.locked, lockBtn));
        const del = document.createElement("button");
        del.type = "button";
        del.className = "danger";
        del.textContent = "Delete";
        del.disabled = !!session.live || protectedSession;
        if (session.live) del.title = "Session Active";
        else if (protectedSession) del.title = "Locked";
        if (!del.disabled) del.addEventListener("click", () => openDialog([session]));
        const moveBtn = document.createElement("button");
        moveBtn.type = "button";
        moveBtn.className = "move";
        moveBtn.append(folderInputIcon());
        moveBtn.setAttribute("aria-label", "Move to another folder");
        moveBtn.disabled = !!session.live || protectedSession;
        if (session.live) moveBtn.title = "Session Active";
        else if (protectedSession) moveBtn.title = "Locked";
        else moveBtn.title = "Move to another folder";
        if (!moveBtn.disabled) moveBtn.addEventListener("click", () => openMove(session));
        li.append(lead, main, when, moveBtn, pinBtn, lockBtn, del);
        return li;
      }

      async function copyText(text, button) {
        const previous = button.textContent;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const area = document.createElement("textarea");
          area.value = text;
          document.body.append(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = previous; }, 900);
      }

      function sessionById(id) {
        for (const group of groups) {
          const found = group.sessions.find((session) => session.id === id);
          if (found) return found;
        }
        return null;
      }

      async function setLock(kind, id, locked, button) {
        if (button) button.disabled = true;
        showError("");
        let response;
        try {
          response = await fetch("/api/locks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kind: kind, id: id, locked: locked }),
          });
        } catch {
          if (button) button.disabled = false;
          showError("Could not reach Grok Manager.");
          return;
        }
        if (!response.ok) {
          let message = "Could not update the lock.";
          try {
            const body = await response.json();
            if (body && body.error) message = body.error;
          } catch { /* keep default */ }
          if (button) button.disabled = false;
          showError(message);
          return;
        }
        await load();
      }

      async function setPin(id, pinned, button) {
        if (button) button.disabled = true;
        showError("");
        let response;
        try {
          response = await fetch("/api/pins", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id, pinned: pinned }),
          });
        } catch {
          if (button) button.disabled = false;
          showError("Could not reach Grok Manager.");
          return;
        }
        if (!response.ok) {
          let message = "Could not update the pin.";
          try {
            const body = await response.json();
            if (body && body.error) message = body.error;
          } catch { /* keep default */ }
          if (button) button.disabled = false;
          showError(message);
          return;
        }
        await load();
      }

      function setMoveVisible(show) {
        dialogMove.hidden = !show;
        moveField.hidden = !show;
      }

      function openMove(session) {
        if (!deletable(session)) return;
        const current = groups.find((group) => group.sessions.some((row) => row.id === session.id));
        const choices = groups
          .filter((group) => !current || group.cwd !== current.cwd)
          .slice()
          .sort((a, b) => a.label.localeCompare(b.label) || a.cwd.localeCompare(b.cwd));
        dialogMode = "move";
        pending = [session];
        dialogTitle.textContent = "Move this session?";
        dialogCopy.hidden = true;
        dialogId.hidden = false;
        dialogList.hidden = true;
        dialogName.textContent = session.title;
        dialogId.textContent = session.id;
        moveTarget.replaceChildren();
        for (const group of choices) {
          const option = document.createElement("option");
          option.value = group.cwd;
          option.textContent = group.label + "  " + group.cwd;
          moveTarget.append(option);
        }
        setMoveVisible(true);
        confirmBtn.textContent = "Move";
        confirmBtn.disabled = choices.length === 0;
        dialogEl.hidden = false;
        if (choices.length) moveTarget.focus();
        else cancelBtn.focus();
      }

      function openDialog(sessions) {
        dialogMode = "delete";
        setMoveVisible(false);
        confirmBtn.textContent = "Delete";
        pending = sessions.filter((session) => deletable(session));
        if (pending.length === 0) return;
        const many = pending.length > 1;
        dialogTitle.textContent = many ? "Delete " + pending.length + " sessions?" : "Delete this session?";
        dialogCopy.hidden = many;
        dialogId.hidden = many;
        dialogList.hidden = !many;
        dialogList.replaceChildren();
        if (many) {
          const shown = pending.slice(0, 8);
          for (const session of shown) {
            const li = document.createElement("li");
            li.textContent = session.title;
            const sid = document.createElement("span");
            sid.className = "sid";
            sid.textContent = session.id;
            li.append(sid);
            dialogList.append(li);
          }
          if (pending.length > shown.length) {
            const more = document.createElement("li");
            more.textContent = "and " + (pending.length - shown.length) + " more";
            dialogList.append(more);
          }
        } else {
          dialogName.textContent = pending[0].title;
          dialogId.textContent = pending[0].id;
        }
        confirmBtn.disabled = false;
        dialogEl.hidden = false;
        cancelBtn.focus();
      }

      function closeDialog() {
        pending = [];
        dialogMode = "delete";
        dialogEl.hidden = true;
      }

      async function confirmMove() {
        const session = pending[0];
        const cwd = moveTarget.value;
        if (!session || !cwd) return;
        confirmBtn.disabled = true;
        showError("");
        let response;
        try {
          response = await fetch("/api/sessions/move", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: session.id, cwd: cwd }),
          });
        } catch {
          confirmBtn.disabled = false;
          showError("Could not reach Grok Manager.");
          return;
        }
        if (response.ok) {
          closeDialog();
          await load();
          return;
        }
        let message = "Could not move that session.";
        try {
          const body = await response.json();
          if (body && body.error) message = body.error;
        } catch { /* keep default */ }
        confirmBtn.disabled = false;
        showError(message);
        closeDialog();
      }

      async function confirmDelete() {
        if (dialogMode === "move") {
          await confirmMove();
          return;
        }
        if (pending.length === 0) return;
        const sessions = pending.slice();
        confirmBtn.disabled = true;
        showError("");
        let response;
        try {
          if (sessions.length === 1) {
            response = await fetch("/api/sessions/" + encodeURIComponent(sessions[0].id), { method: "DELETE" });
          } else {
            response = await fetch("/api/sessions/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ ids: sessions.map((session) => session.id) }),
            });
          }
        } catch {
          confirmBtn.disabled = false;
          showError("Could not reach Grok Manager.");
          return;
        }
        if (sessions.length === 1) {
          if (response.status === 204) {
            selected.delete(sessions[0].id);
            closeDialog();
            await load();
            return;
          }
          let message = "Could not delete that session.";
          try {
            const body = await response.json();
            if (body && body.error) message = body.error;
          } catch { /* keep default */ }
          confirmBtn.disabled = false;
          showError(message);
          closeDialog();
          return;
        }
        let body = {};
        try { body = await response.json(); } catch { /* keep empty */ }
        const deleted = new Set(Array.isArray(body.deleted) ? body.deleted : []);
        for (const id of deleted) selected.delete(id);
        const failed = Array.isArray(body.failed) ? body.failed : [];
        closeDialog();
        if (!response.ok && body.error) showError(body.error);
        else if (failed.length) showError(failed.length + " session" + (failed.length === 1 ? "" : "s") + " could not be deleted.");
        await load();
      }

      async function load() {
        showError("");
        let response;
        try {
          response = await fetch("/api/sessions", { cache: "no-store" });
        } catch {
          showError("Could not reach Grok Manager.");
          return;
        }
        if (!response.ok) {
          showError("Could not load sessions.");
          return;
        }
        const data = await response.json();
        groups = Array.isArray(data.groups) ? data.groups : [];
        pinOrder = Array.isArray(data.pinned) ? data.pinned : [];
        machines = Array.isArray(data.machines) ? data.machines : [];
        discovered = Array.isArray(data.discovered) ? data.discovered : [];
        showUpdate(data.update);
        renderMachines();
        const known = new Set();
        for (const group of groups) {
          for (const session of group.sessions) known.add(session.id);
        }
        for (const id of [...selected]) {
          if (!known.has(id)) selected.delete(id);
        }
        render();
      }

      filterEl.addEventListener("input", render);
      clearSelectionBtn.addEventListener("click", () => {
        selected.clear();
        render();
      });
      deleteSelectedBtn.addEventListener("click", () => {
        openDialog([...selected].map(sessionById).filter(Boolean));
      });
      cancelBtn.addEventListener("click", closeDialog);
      confirmBtn.addEventListener("click", confirmDelete);
      dialogEl.addEventListener("click", (event) => {
        if (event.target === dialogEl) closeDialog();
      });
      function machineLink(machine, removable) {
        const wrap = document.createElement("span");
        wrap.className = "extra-machine";
        const link = document.createElement("a");
        link.href = machine.url;
        link.textContent = machine.name;
        link.rel = "noreferrer";
        wrap.append(link);
        if (removable) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "machine-remove";
          remove.textContent = "×";
          remove.title = "Remove";
          remove.setAttribute("aria-label", "Remove " + machine.name);
          remove.addEventListener("click", () => removeMachine(machine.name));
          wrap.append(remove);
        }
        return wrap;
      }

      function renderMachines() {
        const listed = machines.filter((machine) => machine && typeof machine.name === "string" && typeof machine.url === "string");
        const saved = new Set(listed.map((machine) => machine.url));
        extraMachinesEl.replaceChildren();
        for (const machine of listed) extraMachinesEl.append(machineLink(machine, true));
        for (const machine of discovered) {
          if (!machine || typeof machine.name !== "string" || typeof machine.url !== "string" || saved.has(machine.url)) continue;
          extraMachinesEl.append(machineLink(machine, false));
        }
      }

      function showUpdate(update) {
        const line = document.getElementById("update-line");
        line.hidden = !(update && update.available);
      }

      function showMachineError(message) {
        machineError.hidden = !message;
        machineError.textContent = message || "";
      }

      function closeMachineDialog() {
        machineDialog.hidden = true;
        machineAdd.disabled = false;
      }

      function openMachineDialog() {
        machineNameInput.value = "";
        machineUrlInput.value = "";
        showMachineError("");
        machineDialog.hidden = false;
        machineNameInput.focus();
      }

      async function saveMachines(payload) {
        let response;
        try {
          response = await fetch("/api/machines", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
        } catch {
          return { ok: false, error: "Could not reach Grok Manager." };
        }
        let body = {};
        try { body = await response.json(); } catch { /* keep empty */ }
        if (!response.ok) return { ok: false, error: (body && body.error) || "Could not update machines." };
        machines = Array.isArray(body.machines) ? body.machines : [];
        renderMachines();
        return { ok: true };
      }

      async function removeMachine(name) {
        const result = await saveMachines({ name: name, remove: true });
        if (!result.ok) showError(result.error);
      }

      document.getElementById("update-now").addEventListener("click", async () => {
        const button = document.getElementById("update-now");
        button.disabled = true;
        button.textContent = "Updating";
        try {
          const response = await fetch("/api/update", { method: "POST" });
          const body = await response.json();
          if (!response.ok) {
            showError((body && body.error) || "Could not update Grok Manager.");
            button.disabled = false;
            button.textContent = "Update";
            return;
          }
          setTimeout(() => window.location.reload(), 1200);
        } catch {
          showError("Could not update Grok Manager.");
          button.disabled = false;
          button.textContent = "Update";
        }
      });
      setInterval(async () => {
        try {
          const response = await fetch("/api/peers", { cache: "no-store" });
          if (!response.ok) return;
          const data = await response.json();
          discovered = Array.isArray(data.discovered) ? data.discovered : [];
          showUpdate(data.update);
          renderMachines();
        } catch { /* keep the current list */ }
      }, 30000);
      addMachinesBtn.addEventListener("click", openMachineDialog);
      machineCancel.addEventListener("click", closeMachineDialog);
      machineDialog.addEventListener("click", (event) => {
        if (event.target === machineDialog) closeMachineDialog();
      });
      machineAdd.addEventListener("click", async () => {
        showMachineError("");
        machineAdd.disabled = true;
        const result = await saveMachines({
          name: machineNameInput.value,
          url: machineUrlInput.value,
        });
        machineAdd.disabled = false;
        if (!result.ok) {
          showMachineError(result.error);
          return;
        }
        closeMachineDialog();
      });
      machineUrlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") machineAdd.click();
      });
      machineNameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") machineUrlInput.focus();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!dialogEl.hidden) closeDialog();
        else if (!machineDialog.hidden) closeMachineDialog();
      });

      load();
    </script>
  </body>
</html>
